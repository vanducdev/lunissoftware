<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="boxFront5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)" rx="24"/>
  
  <g stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <circle cx="400" cy="250" r="180" fill="#8B5CF6" opacity="0.12" filter="blur(60px)"/>

  <g filter="url(#shadow5)" transform="translate(100, 60)">
    <rect width="600" height="380" rx="18" fill="url(#boxFront5)" stroke="#FFFFFF" stroke-width="2"/>
    
    <rect width="600" height="46" rx="18" fill="#FFFFFF"/>
    <path d="M0 32 h600 v14 H0 z" fill="#FFFFFF"/>
    <line x1="0" y1="46" x2="600" y2="46" stroke="#E8EDF2" stroke-width="1"/>
    
    <circle cx="28" cy="23" r="5" fill="#EF4444"/>
    <circle cx="44" cy="23" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="23" r="5" fill="#10B981"/>

    <text x="300" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#718096" text-anchor="middle">Lush Chatbot AI – Conversational Sales Agent v2.4</text>

    <!-- Sidebar -->
    <rect x="0" y="47" width="140" height="333" fill="#F8FAFC"/>
    <line x1="140" y1="47" x2="140" y2="380" stroke="#E8EDF2" stroke-width="1"/>
    
    <rect x="14" y="65" width="112" height="28" rx="8" fill="#8B5CF6" opacity="0.1"/>
    <rect x="22" y="75" width="8" height="8" rx="2" fill="#8B5CF6"/>
    <text x="36" y="83" font-family="sans-serif" font-size="11" font-weight="700" fill="#8B5CF6">Kịch Bản Chatbot</text>

    <text x="36" y="120" font-family="sans-serif" font-size="11" font-weight="600" fill="#718096">Đào tạo AI Prompt</text>
    <text x="36" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#718096">Hội thoại trực tiếp</text>
    <text x="36" y="184" font-family="sans-serif" font-size="11" font-weight="600" fill="#718096">Chốt đơn tự động</text>
    <text x="36" y="216" font-family="sans-serif" font-size="11" font-weight="600" fill="#718096">Tích hợp Web/Zalo</text>

    <!-- KPIs -->
    <g transform="translate(160, 65)">
      <rect width="130" height="70" rx="10" fill="#FFFFFF" stroke="#E8EDF2" stroke-width="1"/>
      <text x="12" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#718096">Tin Nhắn Xử Lý</text>
      <text x="12" y="48" font-family="sans-serif" font-size="18" font-weight="800" fill="#172B3A">94,200/ngày</text>
      <text x="12" y="62" font-family="sans-serif" font-size="9" font-weight="700" fill="#10B981">Phản hồi dưới 0.3s</text>

      <rect x="145" y="0" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#E8EDF2" stroke-width="1"/>
      <text x="157" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#718096">Tỷ Lệ Tự Động Chốt</text>
      <text x="157" y="48" font-family="sans-serif" font-size="18" font-weight="800" fill="#8B5CF6">44.6% Đơn</text>
      <text x="157" y="62" font-family="sans-serif" font-size="9" font-weight="700" fill="#10B981">Không cần người trực</text>

      <rect x="290" y="0" width="130" height="70" rx="10" fill="url(#purpleGrad)"/>
      <text x="302" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.9">Mô Hình AI</text>
      <text x="302" y="48" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Lush-LLM v4</text>
      <text x="302" y="62" font-family="sans-serif" font-size="9" font-weight="700" fill="#E9D5FF">Học ngữ cảnh tiếng Việt</text>
    </g>

    <!-- Chat Flow Simulation -->
    <g transform="translate(160, 150)">
      <rect width="420" height="205" rx="12" fill="#FFFFFF" stroke="#E8EDF2" stroke-width="1"/>
      <text x="18" y="28" font-family="sans-serif" font-size="13" font-weight="800" fill="#172B3A">Hội Thoại Mẫu Với Khách Hàng (Live Simulation)</text>

      <g transform="translate(18, 42)">
        <!-- User Bubble -->
        <rect x="160" y="0" width="224" height="34" rx="10" fill="#F1F5F9"/>
        <text x="172" y="21" font-family="sans-serif" font-size="11" fill="#172B3A">Shop tư vấn giúp mình gói dùng 1 năm nhé?</text>

        <!-- Bot Bubble -->
        <rect x="0" y="42" width="280" height="46" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.2"/>
        <circle cx="16" cy="65" r="7" fill="#8B5CF6"/>
        <text x="30" y="58" font-family="sans-serif" font-size="11" font-weight="700" fill="#8B5CF6">Lush AI Bot:</text>
        <text x="30" y="76" font-family="sans-serif" font-size="11" fill="#172B3A">Dạ gói 1 năm đang giảm 30% tặng kèm 3 tháng...</text>

        <!-- Action / CTA Card -->
        <rect x="0" y="96" width="280" height="42" rx="10" fill="#FFFFFF" stroke="#E8EDF2"/>
        <text x="14" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">✓ Đã lấy SĐT khách: 0988.123.xxx</text>
        <text x="14" y="128" font-family="sans-serif" font-size="9" fill="#718096">Tự động đẩy vào CRM & báo Sales</text>
      </g>
    </g>
  </g>

  <g transform="translate(60, 410)" filter="url(#shadow5)">
    <rect width="180" height="48" rx="24" fill="#FFFFFF" stroke="#E8EDF2" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="url(#purpleGrad)"/>
    <path d="M19 22 H29 V28 H24 L20 31 V28 H19 Z" fill="#FFFFFF" transform="translate(0, -2)"/>
    <text x="46" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#172B3A">Lush Chatbot AI</text>
    <text x="46" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#8B5CF6">TRỢ LÝ BÁN HÀNG 24/7</text>
  </g>
</svg>
