# ==============================================================================
# CẤU HÌNH NGINX TỐI ƯU CHO LUSHSOFTWARE (LARAVEL 11 & PHP 8.3)
# ==============================================================================
# Hỗ trợ: VPS Ubuntu/Debian, aaPanel, cPanel, CyberPanel, DirectAdmin
# Tối ưu hóa: Tốc độ tải trang, Stream file lớn .EXE/.ZIP, Bảo mật chống hack, Gzip
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Tự động chuyển hướng toàn bộ HTTP sang HTTPS an toàn
    # Bỏ comment dòng dưới nếu bạn đã cài SSL:
    # return 301 https://$host$request_uri;

    # Thư mục gốc website (LƯU Ý: BẮT BUỘC TRỎ VÀO THƯ MỤC /public)
    # Ví dụ trên VPS: /var/www/website_lush/public
    # Ví dụ trên aaPanel: /www/wwwroot/your-domain.com/public
    # Ví dụ trên cPanel: /home/username/public_html/public
    root /var/www/website_lush/public;
    index index.php index.html index.htm;

    charset utf-8;

    # ==========================================================================
    # CẤU HÌNH TẢI TẬP TIN LỚN (EXE, ZIP, MEDIA)
    # ==========================================================================
    client_max_body_size 500M;
    client_body_buffer_size 256k;
    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;

    # Tối ưu truyền tải file trực tiếp (Zero-Copy Transfer)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ==========================================================================
    # BẢO MẬT HỆ THỐNG (SECURITY HEADERS)
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==========================================================================
    # BỘ ĐỆM NÉN GZIP (TĂNG TỐC TẢI TRANG WEB)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ==========================================================================
    # ĐIỀU HƯỚNG LARAVEL (ROUTING)
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # ==========================================================================
    # CACHE TẬP TIN TĨNH (IMAGES, CSS, JS, FONTS)
    # ==========================================================================
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri /index.php?$query_string;
    }

    # ==========================================================================
    # XỬ LÝ PHP-FPM (PHP 8.3)
    # ==========================================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # 1. Nếu dùng Socket (Mặc định Ubuntu/Debian):
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        
        # 2. Nếu dùng aaPanel Socket (bỏ comment dòng dưới, comment dòng trên):
        # fastcgi_pass unix:/tmp/php-cgi-83.sock;

        # 3. Nếu dùng Port TCP 9000 (bỏ comment dòng dưới):
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Tăng timeout tránh lỗi 504 Gateway Timeout khi xử lý đơn hàng/tải file
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ==========================================================================
    # CHẶN TRUY CẬP CÁC FILE NHẠY CẢM (BẢO VỆ DỮ LIỆU)
    # ==========================================================================
    # Chặn file ẩn (.env, .git, .gitignore, .htaccess...)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn trực tiếp truy cập file cấu hình, database sqlite, logs
    location ~* \.(env|sqlite|sqlite3|db|log|sql|bak|sh|py)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;
}

# ==============================================================================
